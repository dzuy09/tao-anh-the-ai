<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tạo Ảnh Thẻ Pro - AI Tách Nền & Xóa Mộc</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .cropper-view-box { outline: 2px solid #ec4899 !important; }
    .cropper-point { background-color: #f43f5e !important; }
    #imageWrapper { position: relative; display: inline-block; max-height: 100%; max-width: 100%; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-400 mb-6">
      Studio Ảnh Thẻ AI - Tự Động Hóa & Xóa Mộc (Offline)
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
      <div class="md:col-span-4 space-y-5">
        
        <!-- KHU VỰC 1: XÓA MỘC ĐỎ (OPENCV OFFLINE) -->
        <div class="p-4 bg-slate-800/50 rounded-xl border border-rose-500/50 space-y-4">
          <h2 class="font-bold text-rose-400 text-sm border-b border-slate-700 pb-2">1. XÓA MỘC ĐỎ (LOCAL SIÊU TỐC)</h2>
          
          <div class="grid grid-cols-2 gap-2">
            <button id="btnToggleBrush" class="py-2 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white text-xs rounded-lg font-bold transition-all">🖌️ Bật Cọ Vẽ</button>
            <button id="btnApplyInpaint" class="py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs rounded-lg font-bold transition-all opacity-50 cursor-not-allowed" disabled>⏳ Đang tải thuật toán...</button>
          </div>
          
          <div id="brushTools" class="hidden bg-slate-900 p-2 rounded-lg border border-slate-700">
             <label class="block text-[11px] text-slate-400 mb-1">Cỡ cọ: <span id="brushSizeLabel">20</span>px</label>
             <input type="range" id="brushSize" min="5" max="80" value="20" class="w-full accent-rose-500" />
             <p class="text-[10px] text-rose-300 mt-2 italic">* Dùng chuột bôi kín phần dấu mộc trên ảnh, sau đó bấm Xóa Mộc.</p>
          </div>
        </div>

        <!-- KHU VỰC 2: XỬ LÝ ẢNH ĐƠN -->
        <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700 space-y-4">
          <h2 class="font-bold text-pink-400 text-sm border-b border-slate-700 pb-2">2. CẮT & TÁCH NỀN AI TÓC</h2>
          
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Tải ảnh gốc</label>
            <input type="file" id="fileInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-pink-600 file:text-white file:cursor-pointer" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Khung Cắt</label>
            <div class="grid grid-cols-2 gap-2">
              <button id="btnCrop3x4" class="py-2 bg-pink-950/60 border border-pink-500 text-pink-200 text-xs rounded-lg font-bold">3 x 4 cm</button>
              <button id="btnCrop4x6" class="py-2 bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg font-bold">4 x 6 cm</button>
            </div>
          </div>
          
          <button id="btnProcess" class="w-full py-2.5 bg-gradient-to-r from-pink-600 to-cyan-600 hover:from-pink-500 hover:to-cyan-500 font-bold text-sm rounded-lg shadow-lg transition-all">
            ÁP DỤNG CẮT & TÁCH NỀN
          </button>
          
          <button id="btnDownload" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-sm rounded-lg shadow-lg transition-all hidden">
            ⬇️ TẢI ẢNH VỀ (.JPG)
          </button>
        </div>

        <!-- CÀI ĐẶT MÀU NỀN -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-1">Màu Nền Thẻ</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center gap-2 p-2 bg-slate-800 rounded-lg cursor-pointer border border-slate-700">
                <input type="radio" name="bgColor" value="#ffffff" checked class="text-pink-500" />
                <span class="w-4 h-4 bg-white rounded-full border"></span>
                <span class="text-xs">Trắng</span>
              </label>
              <label class="flex items-center gap-2 p-2 bg-slate-800 rounded-lg cursor-pointer border border-slate-700">
                <input type="radio" name="bgColor" value="#0066cc" class="text-pink-500" />
                <span class="w-4 h-4 bg-[#0066cc] rounded-full border"></span>
                <span class="text-xs">Xanh thẻ</span>
              </label>
            </div>
          </div>
        </div>

        <!-- KHU VỰC 3: XỬ LÝ HÀNG LOẠT -->
        <div class="p-4 bg-slate-800/80 rounded-xl border border-emerald-600/50 space-y-4">
          <h2 class="font-bold text-emerald-400 text-sm border-b border-emerald-800/50 pb-2">⚡ XỬ LÝ HÀNG LOẠT (TÁCH NỀN)</h2>
          <div>
            <input type="file" id="batchFileInput" accept="image/*" multiple class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-emerald-600 file:text-white file:cursor-pointer" />
          </div>
          <button id="btnBatchProcess" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-sm rounded-lg shadow-lg transition-all">
            🚀 XỬ LÝ & TẢI VỀ TẤT CẢ
          </button>
        </div>

        <!-- Progress Bar -->
        <div id="progressContainer" class="hidden bg-slate-800 border border-cyan-500/40 rounded-xl p-3">
          <div class="flex justify-between text-xs mb-1 text-cyan-300 font-mono">
            <span id="progressText">Đang tải...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-cyan-400 transition-all duration-200" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Khung Xem Trước ẢNH -->
      <div class="md:col-span-8 flex flex-col gap-4">
        <div class="h-[650px] bg-black/50 border border-slate-800 rounded-2xl overflow-hidden flex items-center justify-center relative">
          <div id="imageWrapper">
            <img id="imagePreview" class="max-h-[600px] max-w-full hidden" />
          </div>
          <canvas id="outputCanvas" class="hidden max-h-[600px] shadow-lg rounded-lg"></canvas>
          <div id="placeholderText" class="text-slate-500 text-sm text-center">
            Vui lòng tải ảnh lên để bắt đầu
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // ==========================================
    // TIÊM OPENCV TRỰC TIẾP 
    // ==========================================
    window.isOpenCvReady = false;
    window.isBrushMode = false;

    function activateInpaintButton() {
        const btn = document.getElementById('btnApplyInpaint');
        if (btn && btn.innerText.includes('Đang tải')) {
            btn.innerText = '✨ Xóa Mộc Ngay';
            if (window.isBrushMode) {
               btn.disabled = false;
               btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    }

    const loadOpenCV = () => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.8.0-release.1/dist/opencv.min.js';
      script.async = true;
      script.onload = () => {
        if (typeof cv === 'function' || cv instanceof Promise) {
            Promise.resolve(cv).then(resolvedCv => {
                if (typeof resolvedCv === 'function') {
                    resolvedCv().then(target => {
                        window.cv = target;
                        window.isOpenCvReady = true;
                        activateInpaintButton();
                    }).catch(console.error);
                } else {
                    window.cv = resolvedCv;
                    window.isOpenCvReady = true;
                    activateInpaintButton();
                }
            });
        } else {
            const checkReady = setInterval(() => {
              if (window.cv && window.cv.Mat) {
                clearInterval(checkReady);
                window.isOpenCvReady = true;
                activateInpaintButton();
              }
            }, 200);
        }
      };
      script.onerror = () => alert("Lỗi mạng cục bộ: Vui lòng thử dùng mạng 4G hoặc đường truyền Wifi khác.");
      document.body.appendChild(script);
    };
    
    loadOpenCV();

    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers';
    env.allowLocalModels = false;

    let cropper = null;
    let currentRatio = 3 / 4;
    let segmenter = null;

    const fileInput = document.getElementById('fileInput');
    const batchInput = document.getElementById('batchFileInput');
    const imagePreview = document.getElementById('imagePreview');
    const imageWrapper = document.getElementById('imageWrapper');
    const outputCanvas = document.getElementById('outputCanvas');
    const placeholderText = document.getElementById('placeholderText');
    const progressContainer = document.getElementById('progressContainer');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const progressBar = document.getElementById('progressBar');
    const btnProcess = document.getElementById('btnProcess');
    const btnBatchProcess = document.getElementById('btnBatchProcess');
    const btnDownload = document.getElementById('btnDownload');
    
    const btnToggleBrush = document.getElementById('btnToggleBrush');
    const btnApplyInpaint = document.getElementById('btnApplyInpaint');
    const brushTools = document.getElementById('brushTools');
    const brushSize = document.getElementById('brushSize');
    const brushSizeLabel = document.getElementById('brushSizeLabel');

    // ==========================================
    // LOGIC CỌ VẼ & XÓA MỘC (OPENCV OFFLINE)
    // ==========================================
    let isDrawing = false;
    let drawCanvas = document.createElement('canvas');
    let drawCtx = drawCanvas.getContext('2d');
    
    drawCanvas.style.position = 'absolute';
    drawCanvas.style.zIndex = '50';
    drawCanvas.style.cursor = 'crosshair';
    drawCanvas.style.opacity = '0.5'; 

    btnToggleBrush.onclick = () => {
      if (!imagePreview.src || imagePreview.src === window.location.href) return alert('Vui lòng tải ảnh lên trước!');
      
      window.isBrushMode = !window.isBrushMode;
      if (window.isBrushMode) {
        btnToggleBrush.innerText = '❌ Hủy Vẽ Cọ';
        btnToggleBrush.classList.replace('bg-slate-700', 'bg-rose-900');
        brushTools.classList.remove('hidden');
        
        if (window.isOpenCvReady) {
            btnApplyInpaint.disabled = false;
            btnApplyInpaint.classList.remove('opacity-50', 'cursor-not-allowed');
            btnApplyInpaint.innerText = '✨ Xóa Mộc Ngay';
        } else {
            btnApplyInpaint.disabled = true;
            btnApplyInpaint.classList.add('opacity-50', 'cursor-not-allowed');
            btnApplyInpaint.innerText = '⏳ Đang tải thuật toán...';
        }
        
        if (cropper) cropper.destroy();
        
        drawCanvas.width = imagePreview.naturalWidth;
        drawCanvas.height = imagePreview.naturalHeight;
        drawCanvas.style.width = imagePreview.clientWidth + 'px';
        drawCanvas.style.height = imagePreview.clientHeight + 'px';
        drawCanvas.style.top = imagePreview.offsetTop + 'px';
        drawCanvas.style.left = imagePreview.offsetLeft + 'px';
        
        drawCtx.fillStyle = 'black';
        drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        imageWrapper.appendChild(drawCanvas);
      } else {
        btnToggleBrush.innerText = '🖌️ Bật Cọ Vẽ';
        btnToggleBrush.classList.replace('bg-rose-900', 'bg-slate-700');
        btnApplyInpaint.disabled = true;
        btnApplyInpaint.classList.add('opacity-50', 'cursor-not-allowed');
        brushTools.classList.add('hidden');
        
        if (drawCanvas.parentNode) drawCanvas.parentNode.removeChild(drawCanvas);
        
        // Fix rác Cropper cũ
        if (cropper) cropper.destroy();
        cropper = new Cropper(imagePreview, { aspectRatio: currentRatio, viewMode: 1, autoCropArea: 0.9, responsive: true });
      }
    };

    brushSize.oninput = (e) => brushSizeLabel.innerText = e.target.value;

    function getMousePos(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY };
    }

    drawCanvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pos = getMousePos(drawCanvas, e);
      drawCtx.beginPath();
      drawCtx.moveTo(pos.x, pos.y);
    });

    drawCanvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getMousePos(drawCanvas, e);
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.strokeStyle = 'white'; 
      drawCtx.lineWidth = brushSize.value * (drawCanvas.width / drawCanvas.clientWidth);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.stroke();
    });

    drawCanvas.addEventListener('mouseup', () => isDrawing = false);
    drawCanvas.addEventListener('mouseout', () => isDrawing = false);

    btnApplyInpaint.onclick = async () => {
      if (!window.isOpenCvReady || !window.cv || !window.cv.Mat) {
        return alert('Lõi thuật toán vẫn đang tải. Vui lòng chờ nút bấm chuyển sang "Xóa Mộc Ngay" nhé!');
      }

      progressContainer.classList.remove('hidden');
      progressText.innerText = 'Đang khôi phục ảnh với thuật toán Telea...';
      progressBar.style.width = '50%';
      progressPercent.innerText = '50%';

      setTimeout(() => {
        try {
          const srcCanvas = document.createElement('canvas');
          srcCanvas.width = imagePreview.naturalWidth;
          srcCanvas.height = imagePreview.naturalHeight;
          srcCanvas.getContext('2d').drawImage(imagePreview, 0, 0);

          let srcMatRGBA = window.cv.imread(srcCanvas);
          let srcMatRGB = new window.cv.Mat();
          window.cv.cvtColor(srcMatRGBA, srcMatRGB, window.cv.COLOR_RGBA2RGB); 

          let maskMat = window.cv.imread(drawCanvas);
          let maskGray = new window.cv.Mat();
          window.cv.cvtColor(maskMat, maskGray, window.cv.COLOR_RGBA2GRAY, 0); 

          let dstMat = new window.cv.Mat();
          const radius = 5; 
          window.cv.inpaint(srcMatRGB, maskGray, dstMat, radius, window.cv.INPAINT_TELEA);

          window.cv.imshow(srcCanvas, dstMat);
          const newDataUrl = srcCanvas.toDataURL('image/jpeg', 1.0);
          
          srcMatRGBA.delete(); srcMatRGB.delete(); maskMat.delete(); maskGray.delete(); dstMat.delete();

          // 1. Tắt cọ vẽ (lệnh này sẽ tự động khôi phục khung Cropper)
          btnToggleBrush.click(); 
          
          // 2. Dùng lệnh replace() thần thánh để Cropper ngậm ảnh mới mà không bị lỗi
          if (cropper) {
              cropper.replace(newDataUrl);
          } else {
              imagePreview.src = newDataUrl;
          }
          
          progressText.innerText = 'Đã xóa mộc thành công!';
          progressBar.style.width = '100%';
          progressPercent.innerText = '100%';
          setTimeout(() => progressContainer.classList.add('hidden'), 2000);
          
        } catch (err) {
          console.error(err);
          alert('Lỗi khi chạy thuật toán: ' + err.message);
          progressContainer.classList.add('hidden');
        }
      }, 50);
    };

    // ==========================================
    // TẢI ẢNH LÊN & CÁC TÁC VỤ KHÁC...
    // ==========================================
    if (fileInput) {
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          if (placeholderText) placeholderText.classList.add('hidden');
          if (outputCanvas) outputCanvas.classList.add('hidden');
          if (btnDownload) btnDownload.classList.add('hidden');
          if (imagePreview) {
            imagePreview.classList.remove('hidden');
            
            // Dùng hàm replace khi tải ảnh mới để chống lỗi kẹt bộ nhớ
            if (cropper) {
              cropper.replace(event.target.result);
            } else {
              imagePreview.src = event.target.result;
              cropper = new Cropper(imagePreview, {
                aspectRatio: currentRatio,
                viewMode: 1,
                autoCropArea: 0.9,
                responsive: true
              });
            }
          }
        };
        reader.readAsDataURL(file);
      });
    }

    if (btn3x4) btn3x4.onclick = () => { currentRatio = 3/4; if (cropper) cropper.setAspectRatio(3/4); };
    if (btn4x6) btn4x6.onclick = () => { currentRatio = 4/6; if (cropper) cropper.setAspectRatio(4/6); };

    async function getAIPipeline() {
      if (segmenter) return segmenter;

      if (progressContainer) progressContainer.classList.remove('hidden');
      if (progressText) progressText.innerText = 'Khởi tạo AI Bóc Tóc (WebGPU)...';
      if (progressBar) progressBar.style.width = '10%';
      if (progressPercent) progressPercent.innerText = '10%';

      let device = 'wasm';
      if (typeof navigator !== 'undefined' && 'gpu' in navigator) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) device = 'webgpu';
        } catch (err) {}
      }

      const modelId = 'onnx-community/ormbg-ONNX';
      
      try {
        segmenter = await pipeline('image-segmentation', modelId, {
          device: device,
          progress_callback: (item) => {
            if (item && item.status === 'progress') {
              const p = Math.round(item.progress || 0);
              if (progressText) progressText.innerText = `Đang tải AI Bóc Tóc (${device.toUpperCase()})...`;
              if (progressBar) progressBar.style.width = `${p}%`;
              if (progressPercent) progressPercent.innerText = `${p}%`;
            }
          }
        });
      } catch (error) {
        segmenter = await pipeline('image-segmentation', modelId, {
          device: 'wasm',
          progress_callback: (item) => {
            if (item && item.status === 'progress') {
              const p = Math.round(item.progress || 0);
              if (progressText) progressText.innerText = `Đang tải AI Bóc Tóc (WASM)...`;
              if (progressBar) progressBar.style.width = `${p}%`;
              if (progressPercent) progressPercent.innerText = `${p}%`;
            }
          }
        });
      }
      return segmenter;
    }

    async function processImageWithAI(imageSourceCanvasOrUrl, targetBgHex, targetWidth, targetHeight) {
      const aiSegmenter = await getAIPipeline();

      if (progressText) progressText.innerText = 'Đang bóc tách nền AI...';
      if (progressBar) progressBar.style.width = '80%';
      if (progressPercent) progressPercent.innerText = '80%';

      const srcImg = new Image();
      srcImg.crossOrigin = 'anonymous';
      const inputUrl = typeof imageSourceCanvasOrUrl === 'string'
        ? imageSourceCanvasOrUrl
        : imageSourceCanvasOrUrl.toDataURL('image/png');

      await new Promise((res, rej) => {
        srcImg.onload = res;
        srcImg.onerror = rej;
        srcImg.src = inputUrl;
      });

      const output = await aiSegmenter(inputUrl);

      const fgCanvas = document.createElement('canvas');
      fgCanvas.width = srcImg.width;
      fgCanvas.height = srcImg.height;
      const fgCtx = fgCanvas.getContext('2d', { willReadFrequently: true });
      fgCtx.drawImage(srcImg, 0, 0);

      let maskImage = null;
      if (output && typeof output.toCanvas === 'function') maskImage = output;
      else if (Array.isArray(output) && output[0]?.mask?.toCanvas) maskImage = output[0].mask;
      else if (Array.isArray(output) && output[0]?.toCanvas) maskImage = output[0];

      if (maskImage) {
        const maskCanvasRaw = maskImage.toCanvas();
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = srcImg.width;
        maskCanvas.height = srcImg.height;
        const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });
        maskCtx.drawImage(maskCanvasRaw, 0, 0, srcImg.width, srcImg.height);

        const fgData = fgCtx.getImageData(0, 0, srcImg.width, srcImg.height);
        const maskData = maskCtx.getImageData(0, 0, srcImg.width, srcImg.height);

        for (let i = 0; i < fgData.data.length; i += 4) {
          fgData.data[i + 3] = maskData.data[i]; 
        }
        fgCtx.putImageData(fgData, 0, 0);
      }

      const resultCanvas = document.createElement('canvas');
      resultCanvas.width = targetWidth;
      resultCanvas.height = targetHeight;
      const ctx = resultCanvas.getContext('2d');

      ctx.fillStyle = targetBgHex;
      ctx.fillRect(0, 0, targetWidth, targetHeight);

      const scale = Math.max(targetWidth / fgCanvas.width, targetHeight / fgCanvas.height);
      const drawW = fgCanvas.width * scale;
      const drawH = fgCanvas.height * scale;
      const posX = (targetWidth - drawW) / 2;
      const posY = (targetHeight - drawH) / 2;

      ctx.drawImage(fgCanvas, posX, posY, drawW, drawH);
      return resultCanvas;
    }

    if (btnProcess) {
      btnProcess.onclick = async () => {
        if (!cropper) return alert('Vui lòng tải ảnh lên trước!');
        try {
          const targetBg = (document.querySelector('input[name="bgColor"]:checked') || {}).value || '#ffffff';
          // Nếu ảnh rỗng, lệnh getCroppedCanvas sẽ gây lỗi, giờ thì hết rồi!
          const croppedCanvas = cropper.getCroppedCanvas();
          if (!croppedCanvas) return alert('Lỗi: Khung cắt chưa sẵn sàng. Vui lòng thử tải lại ảnh!');
          
          const targetW = currentRatio === 3 / 4 ? 900 : 1200;
          const targetH = currentRatio === 3 / 4 ? 1200 : 1800;

          const finalCanvas = await processImageWithAI(croppedCanvas, targetBg, targetW, targetH);

          if (outputCanvas) {
            outputCanvas.width = targetW;
            outputCanvas.height = targetH;
            const outCtx = outputCanvas.getContext('2d');
            outCtx.drawImage(finalCanvas, 0, 0);

            if (imagePreview) imagePreview.classList.add('hidden');
            if (cropper) cropper.destroy();
            outputCanvas.classList.remove('hidden');
          }

          if (progressContainer) progressContainer.classList.add('hidden');
          
          if (btnDownload && fileInput.files.length > 0) {
            btnDownload.classList.remove('hidden');
            const originalName = fileInput.files[0].name.replace(/\.[^/.]+$/, "");
            btnDownload.onclick = () => {
              const link = document.createElement('a');
              link.download = `${originalName}.jpg`;
              link.href = finalCanvas.toDataURL('image/jpeg', 1.0);
              link.click();
            };
          }
        } catch (err) {
          console.error('Lỗi xử lý AI:', err);
          alert('Có lỗi khi xử lý AI Tách nền: ' + err.message);
          if (progressContainer) progressContainer.classList.add('hidden');
        }
      };
    }

    if (btnBatchProcess) {
      btnBatchProcess.onclick = async () => {
        const files = batchInput ? batchInput.files : null;
        if (!files || files.length === 0) {
          return alert('Vui lòng chọn ít nhất 1 ảnh để xử lý hàng loạt!');
        }

        const targetBg = (document.querySelector('input[name="bgColor"]:checked') || {}).value || '#ffffff';
        const targetW = currentRatio === 3 / 4 ? 900 : 1200;
        const targetH = currentRatio === 3 / 4 ? 1200 : 1800;

        if (progressContainer) progressContainer.classList.remove('hidden');

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          if (progressText) progressText.innerText = `Đang xử lý ảnh (${i + 1}/${files.length}): ${file.name}...`;

          const dataUrl = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
          });

          try {
            const finalCanvas = await processImageWithAI(dataUrl, targetBg, targetW, targetH);
            const link = document.createElement('a');
            const cleanName = file.name.replace(/\.[^/.]+$/, "");
            link.download = `${cleanName}.jpg`;
            link.href = finalCanvas.toDataURL('image/jpeg', 1.0);
            link.click();

            await new Promise((r) => setTimeout(r, 400));
          } catch (err) {
            console.error(`Lỗi xử lý file ${file.name}:`, err);
          }
        }

        if (progressContainer) progressContainer.classList.add('hidden');
        alert(`✅ Đã hoàn tất xử lý & tải về ${files.length} ảnh thẻ!`);
      };
    }
  </script>
</body>
</html>
